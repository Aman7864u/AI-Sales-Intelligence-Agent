server:
  port: 8081

spring:
  application:
    name: sales-intelligence-agent

  data:
    mongodb:
      # Local Atlas (docker compose) by default. For Atlas in the cloud set MONGODB_URI=mongodb+srv://user:pass@cluster.xxxx.mongodb.net/
      uri: ${MONGODB_URI:mongodb://localhost:27017/?directConnection=true}
      database: ${MONGODB_DATABASE:sales_agent}
      auto-index-creation: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing
        timeout: 20m
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}     # must support tool calling
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}   # 768 dimensions

    vectorstore:
      mongodb:
        collection-name: product_knowledge
        index-name: vector_index
        path-name: embedding
        initialize-schema: true

    mcp:
      server:
        name: sales-intelligence
        version: 1.0.0
        type: SYNC
        protocol: SSE
        sse-message-endpoint: /mcp/message

  http:
    client:
      read-timeout: 300s     # local models can be slow on the first request

app:
  currency: USD
  seed:
    enabled: true            # generate ~18k demo sales records on first start
  knowledge:
    autoload: true           # embed the markdown files in classpath:knowledge on first start
    collection: product_knowledge
  rag:
    top-k: 4
    similarity-threshold: 0.4

logging:
  level:
    com.example.salesagent: INFO
